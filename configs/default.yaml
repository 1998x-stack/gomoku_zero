env:
  id: gomoku_exact5:GomokuExact5-v0
  board_size: 15
  seed: 42

net:
  channels: 128
  blocks: 12

mcts:
  sims: 800
  c_puct: 2.0
  root_dirichlet_eps: 0.25
  root_dirichlet_alpha: 0.05
  temperature_moves: 12  # 前12手 τ=1，之后 τ=0.1
  temperature_eval: 0.0  # 评测 τ=0
  virtual_loss: 1.0

replay:
  capacity_steps: 800000
  batch_size: 256

data:
  selfplay_dir: data/selfplay

opt:
  lr: 0.002
  weight_decay: 0.0001

train:
  steps: 100000
  save_every: 5000
  logdir: runs/gomoku_zero

eval:
  games: 400
  threshold: 0.55
