[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gomoku-zero"
version = "0.1.0"
description = "AlphaGo Zero style training framework for Exact-5 Gomoku"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.23",
  "gymnasium>=0.29.0",
  "torch>=2.2",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "loguru>=0.7.0",
  "tensorboard>=2.14",
  # 需要你提前安装 gomoku-exact5 环境包，提供 gomoku_exact5:GomokuExact5-v0
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5.0", "mypy>=1.5.0"]
