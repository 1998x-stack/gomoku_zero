[metadata]
license_files = LICENSE

[options]
packages = find:
package_dir =
    = src
include_package_data = True

[options.packages.find]
where = src

[tool:pytest]
addopts = -q
# 测试金字塔分层：tests/{unit,integration,regression,e2e}
testpaths = tests
markers =
    unit: 单测：按模块隔离、依赖打桩
    integration: 集成测试：多模块真实协作
    regression: 回归测试：钉住已知 bug / 行为契约
    e2e: 端到端：完整自对弈->训练->评估->门禁流水线（较慢）

[mypy]
python_version = 3.9
ignore_missing_imports = True
strict_optional = True
warn_unused_ignores = True
